name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: coloplus
          POSTGRES_PASSWORD: coloplus
          POSTGRES_DB: coloplus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coloplus -d coloplus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://coloplus:coloplus@127.0.0.1:5432/coloplus?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            backend/go.sum
            pkg-common/go.sum
      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          cd backend && swag init -g cmd/api/main.go -o docs
      - name: Vet
        run: |
          cd backend && go vet ./...
          cd ../pkg-common && go vet ./...
      - name: Lint (includes the layer import rules)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: backend
      - name: Unit tests
        run: |
          cd backend && go test -race ./tests/unit/...
          cd ../pkg-common && go test -race ./...
      - name: Integration tests (real Postgres)
        run: cd backend && go test -count=1 ./tests/integration/...

  # Build, push and deploy only run once the server side exists and the repo
  # variable DEPLOY_ENABLED is set to "true" (Settings > Variables).
  build:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The server key is restricted to a forced command (deploy.sh), which
      # runs migrations, starts the new image, waits for its HEALTHCHECK and
      # rolls back automatically on failure.
      - name: Trigger deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$DEPLOY_KEY" > key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes "$DEPLOY_TARGET"
